<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Game</title>
</head>
<body>
    <h1> Bat  Ball Stump Game </h1>
    <button class="choice-button" onclick="
    let computerChoice = generateComputerChoice();
     let resultMsg = getResult('Bat', computerChoice);
  showResult('Bat', computerChoice, resultMsg);
    ">Bat</button>

    <button class="choice-button" onclick="computerChoice = generateComputerChoice();
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg);">Ball</button>


    <button class="choice-button" onclick="computerChoice = generateComputerChoice();
     resultMsg = getResult('Stump', computerChoice);
    showResult('Stump', computerChoice, resultMsg);">Stump</button>

    
    <h3 id="user-move"></h3>
    <h3 id="computer-move"></h3>
    <h3 id="result"></h3>
    <h3 id="score"></h3>

    <button onclick="localStorage.clear()
    resetScore(); ">Reset</button>
    
</body>
<script src="script.js"></script>
</html>
