<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat Ball Stump Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-panel">
        <p class="eyebrow">Cricket challenge</p>
        <h1>Bat Ball Stump</h1>

        <div class="choices" aria-label="Game choices">
            <button class="choice-button" data-choice="Bat" aria-label="Choose Bat">
                <img src="images/bat.png" alt="Bat" class="choice-image">
                <span>Bat</span>
            </button>

            <button class="choice-button" data-choice="Ball" aria-label="Choose Ball">
                <img src="images/ball.png" alt="Ball" class="choice-image">
                <span>Ball</span>
            </button>

            <button class="choice-button" data-choice="Stump" aria-label="Choose Stump">
                <img src="images/stump.png" alt="Stump" class="choice-image stump-image">
                <span>Stump</span>
            </button>
        </div>

        <div class="status-board">
            <div class="status-item">
                <span class="status-label">You</span>
                <strong id="user-move">Ready?</strong>
            </div>
            <div class="status-item">
                <span class="status-label">Computer</span>
                <strong id="computer-move">Waiting...</strong>
            </div>
        </div>

        <div class="result-box">
            <p id="result">Make your move to begin the match!</p>
        </div>

        <div class="score-card">
            <span class="score-label">Scoreboard</span>
            <div class="score-grid" id="score" aria-label="Match score">
                <div class="score-stat">
                    <strong id="wins">0</strong>
                    <span>Won</span>
                </div>
                <div class="score-stat">
                    <strong id="losses">0</strong>
                    <span>Lost</span>
                </div>
                <div class="score-stat">
                    <strong id="ties">0</strong>
                    <span>Tied</span>
                </div>
            </div>
        </div>

        <button class="reset-button" id="reset-button" type="button">Reset Score</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
